[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4urban-science"
version = "2.0.0"
description = "Released source tables, figure rerenders, and open-model analysis for AI4US"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Yecheng Zhang"},
  {name = "Rong Zhao"},
  {name = "Zimu Huang"},
  {name = "Xinyu Wang"},
  {name = "Yue Ma"},
  {name = "Ying Long"},
]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
